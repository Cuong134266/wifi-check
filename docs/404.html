<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Không tìm thấy trang | UXTeam</title>
  <meta name="description" content="Trang bạn tìm kiếm không tồn tại.">
  <link rel="icon" type="image/png" href="/wifi-check/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent2: #06b6d4;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(99,102,241,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.07) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift {
      from { transform: translate(0,0); }
      to   { transform: translate(48px, 48px); }
    }

    .bg-glow-1 {
      position: fixed; width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,.18) 0%, transparent 70%);
      top: -150px; left: -150px; z-index: 0;
      animation: floatGlow1 12s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      position: fixed; width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,.15) 0%, transparent 70%);
      bottom: -100px; right: -100px; z-index: 0;
      animation: floatGlow2 15s ease-in-out infinite alternate;
    }
    @keyframes floatGlow1 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(60px, 60px) scale(1.1); }
    }
    @keyframes floatGlow2 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(-40px,-40px) scale(1.15); }
    }

    /* ── Layout ── */
    .container {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      gap: 0;
    }

    /* ── WiFi icon animation ── */
    .wifi-wrap {
      position: relative;
      width: 120px; height: 120px;
      margin-bottom: 32px;
    }
    .wifi-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: ripple 2.4s ease-out infinite;
    }
    .wifi-ring:nth-child(1) { inset: 30px; animation-delay: 0s; }
    .wifi-ring:nth-child(2) { inset: 15px; animation-delay: .6s; }
    .wifi-ring:nth-child(3) { inset: 0px;  animation-delay: 1.2s; }
    @keyframes ripple {
      0%   { opacity: .8; transform: scale(.6); }
      100% { opacity: 0;  transform: scale(1.1); }
    }
    .wifi-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .wifi-icon svg {
      width: 48px; height: 48px;
      filter: drop-shadow(0 0 12px rgba(99,102,241,.8));
    }

    /* ── 404 number ── */
    .error-code {
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 16px;
      text-shadow: none;
      position: relative;
    }
    .error-code::after {
      content: '404';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(24px);
      opacity: .4;
      z-index: -1;
    }

    /* ── Text ── */
    .title {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    .subtitle {
      font-size: 15px;
      color: var(--muted);
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* ── Buttons ── */
    .btn-group {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 48px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all .2s ease;
      border: none; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 24px rgba(99,102,241,.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(99,102,241,.5);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.08);
      transform: translateY(-2px);
    }

    /* ── Countdown ── */
    .countdown-bar-wrap {
      width: min(320px, 80vw);
    }
    .countdown-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .countdown-label span {
      color: var(--accent2);
      font-weight: 600;
    }
    .bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 100%;
      transition: width 1s linear;
    }

    /* ── Floating particles ── */
    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      10%  { opacity: .7; }
      90%  { opacity: .3; }
      100% { opacity: 0; transform: translateY(-80vh) scale(1.5); }
    }

    @media (max-width: 480px) {
      .wifi-wrap { width: 90px; height: 90px; margin-bottom: 24px; }
      .wifi-icon svg { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>
<div class="particles" id="particles"></div>

<div class="container">

  <!-- WiFi animated icon -->
  <div class="wifi-wrap">
    <div class="wifi-ring"></div>
    <div class="wifi-ring"></div>
    <div class="wifi-ring"></div>
    <div class="wifi-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- WiFi bars with slash -->
        <path d="M5 12.5C7.20914 10.5711 9.97083 9.5 12 9.5C14.0292 9.5 16.7909 10.5711 19 12.5" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M1.5 8.5C5.16914 5.19365 8.43083 3.5 12 3.5C15.5692 3.5 18.8309 5.19365 22.5 8.5" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
        <path d="M8.5 16C9.44305 15.0949 10.6923 14.5 12 14.5C13.3077 14.5 14.557 15.0949 15.5 16" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="20" r="1.5" fill="#06b6d4"/>
        <!-- Small X overlay -->
        <line x1="2" y1="2" x2="22" y2="22" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
  </div>

  <div class="error-code">404</div>
  <h1 class="title">Trang không tìm thấy</h1>
  <p class="subtitle">
    Có vẻ trang bạn đang tìm đã bị mất kết nối hoặc không tồn tại.<br>
    Hãy quay về trang chủ và thử lại nhé!
  </p>

  <div class="btn-group">
    <a href="/wifi-check/" class="btn btn-primary" id="btn-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      Về trang chủ
    </a>
    <button class="btn btn-secondary" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
      Quay lại
    </button>
  </div>

  <!-- Countdown -->
  <div class="countdown-bar-wrap">
    <p class="countdown-label">Tự động chuyển hướng sau <span id="timer">10</span> giây</p>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
  </div>

</div>

<script>
  /* ── Particles ── */
  const pc = document.getElementById('particles');
  const colors = ['#6366f1','#06b6d4','#8b5cf6','#f59e0b'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left:${Math.random()*100}%;
      bottom:${-10 + Math.random()*10}px;
      width:${2+Math.random()*4}px;
      height:${2+Math.random()*4}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${6+Math.random()*10}s;
      animation-delay:${Math.random()*8}s;
    `;
    pc.appendChild(p);
  }

  /* ── Countdown & redirect ── */
  const TOTAL = 10;
  let remaining = TOTAL;
  const timerEl = document.getElementById('timer');
  const barEl   = document.getElementById('bar');

  barEl.style.width = '100%';

  const tick = setInterval(() => {
    remaining--;
    timerEl.textContent = remaining;
    barEl.style.width = ((remaining / TOTAL) * 100) + '%';
    if (remaining <= 0) {
      clearInterval(tick);
      window.location.href = '/wifi-check/';
    }
  }, 1000);

  /* Stop countdown if user interacts */
  document.getElementById('btn-home').addEventListener('click', () => clearInterval(tick));
  document.querySelector('.btn-secondary').addEventListener('click', () => clearInterval(tick));
</script>

</body>
</html>
